[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qf-guard"
version = "0.1.0"
description = "Realtime fraud scoring with QUBO investigation prioritisation on SQA or D-Wave quantum annealers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QF-Guard Team" }]
dependencies = [
  "joblib==1.5.3",
  "lightgbm==4.6.0",
  "numpy==2.1.3",
  "pandas==2.3.3",
  "scikit-learn==1.8.0",
  "streamlit==1.59.1",
  "openjij==0.12.0",
]

[project.optional-dependencies]
quantum = ["dwave-ocean-sdk==9.4.0"]
dev = ["ruff>=0.7", "pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/qf_guard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"dashboard/app.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
