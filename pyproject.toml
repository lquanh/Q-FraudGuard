[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qf-guard"
version = "0.1.0"
description = "Classical-AI-first financial fraud investigation prototype with optional QUBO optimization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QF-Guard Team" }]
dependencies = [
  "joblib==1.5.3",
  "lightgbm==4.6.0",
  "numpy==2.1.3",
  "pandas==2.3.3",
  "scikit-learn==1.8.0",
  "streamlit==1.59.1",
  "openjij==0.12.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/qf_guard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"dashboard/app.py" = ["E402"]
